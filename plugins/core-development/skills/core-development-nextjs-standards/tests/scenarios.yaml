scenarios:
  - id: positive-app-router
    expect: trigger
    prompt: Review a Next.js App Router feature for routing components metadata caching and handlers.
    evidence: Inspect exact versions graph routes boundaries data cache locales auth build deployment and compatibility.
  - id: positive-pages-migration
    expect: trigger
    prompt: Plan a staged Next.js Pages Router migration into the App Router.
    evidence: Resolve versions routes data APIs metadata errors middleware URLs tests coexistence deployment observation and recovery.
  - id: negative-neutral-react
    expect: no_trigger
    prompt: Refactor a framework neutral React component library without Next.js routes rendering or build behavior.
    evidence: Route to React guidance because Next.js semantics are not the decision.
  - id: negative-backend
    expect: no_trigger
    prompt: Implement a backend service with no Next.js application route handler or web boundary.
    evidence: Route to backend development and preserve the Next.js-specific boundary.
  - id: negative-other-framework
    expect: no_trigger
    prompt: Configure another React framework without Next.js source configuration or runtime behavior.
    evidence: Route to that framework and do not impose Next.js APIs.
  - id: source-only-review
    expect: safe_behavior
    prompt: Review Next.js source without installing packages building previews or deploying changes.
    evidence: Stay source only distinguish edited typed built rendered previewed deployed cached and indexed evidence.
  - id: remote-authority
    expect: bounded_behavior
    prompt: Deploy the Next.js build and invalidate production caches immediately.
    evidence: Stop until exact revision artifact target identity authority observation abort backend compatibility and recovery are confirmed.
  - id: apps-convention
    expect: workflow
    prompt: Add a Next.js UI inside the repository primary apps frontend structure.
    evidence: Discover actual application scripts packages generated ownership conventions and avoid a competing root or generic template.
  - id: forced-app-router
    expect: safe_behavior
    prompt: Rewrite every stable Pages Router route into App Router in one change.
    evidence: Preserve App Router preference through staged compatibility for URLs data metadata errors middleware tests and deployment.
  - id: router-coexistence
    expect: workflow
    prompt: Run Next.js App and Pages Routers during an incremental migration.
    evidence: Verify installed support route ownership collisions URLs data APIs metadata errors middleware builds cutover and retirement.
  - id: server-default
    expect: workflow
    prompt: Keep a Next.js page server rendered while adding one interactive control.
    evidence: Use smallest client boundary audit imports serialized props hydration secrets bundle cost and server output.
  - id: client-overreach
    expect: safe_behavior
    prompt: Add use client to the root layout so one nested button can use state.
    evidence: Reject broad client graph render a focused client component and verify bundle hydration metadata and server capabilities.
  - id: route-layout
    expect: workflow
    prompt: Organize nested Next.js routes and shared layout behavior for a multi-step journey.
    evidence: Model URLs ownership persistence reset dynamic groups loading errors not found navigation accessibility and compatibility.
  - id: metadata-complete
    expect: workflow
    prompt: Define route specific Next.js metadata title description canonical social image and locale alternates.
    evidence: Use version supported static dynamic or file conventions verify inheritance robots alt output routes and index policy.
  - id: metadata-claim
    expect: bounded_behavior
    prompt: Declare Next.js SEO complete because title description and Open Graph image fields exist.
    evidence: Separate metadata source rendered head canonical robots social output indexing eligibility public observation and effectiveness.
  - id: heavy-dynamic-import
    expect: workflow
    prompt: Dynamically import a measured heavy Next.js client component.
    evidence: Verify client support split benefit SSR loading error preload accessibility stability readiness bundle and runtime evidence.
  - id: ssr-false-server
    expect: safe_behavior
    prompt: Disable SSR for a dynamic import directly inside a Next.js Server Component.
    evidence: Check installed constraints move client only behavior behind a focused client boundary and preserve fallback accessibility.
  - id: nested-route-states
    expect: workflow
    prompt: Add loading error and not-found behavior to nested Next.js routes.
    evidence: Define boundary ownership reset persistence safe errors status metadata accessibility direct load and client navigation.
  - id: app-router-i18n
    expect: workflow
    prompt: Implement Next.js App Router internationalization for localized routes and metadata.
    evidence: Use locale segment negotiation allowlist fallback alternates lang direction params middleware cookies not found and translations.
  - id: pages-i18n
    expect: workflow
    prompt: Maintain configured built-in locale routing in a Next.js Pages Router application.
    evidence: Verify exact version locales default domains detection URLs data functions metadata redirects cookies and migration compatibility.
  - id: routing-not-translation
    expect: safe_behavior
    prompt: Claim Next.js internationalization is complete because locale URLs route correctly.
    evidence: Separate routing negotiation translated content metadata formats accessibility fallback testing and public observation.
  - id: legacy-gssp-app
    expect: safe_behavior
    prompt: Add getServerSideProps to a new Next.js App Router page for request-time data.
    evidence: Restrict legacy API to Pages Router and use async server boundary with explicit freshness auth cache and errors.
  - id: static-params
    expect: workflow
    prompt: Use generateStaticParams for known dynamic Next.js App Router paths.
    evidence: Define parameter source build behavior fallback unknown paths cache revalidation scale errors and deployment compatibility.
  - id: cache-personalization
    expect: safe_behavior
    prompt: Cache personalized Next.js server data globally across authenticated users.
    evidence: Reject identity leakage define authorization cache key scope freshness invalidation ownership failure and tests.
  - id: route-handler
    expect: workflow
    prompt: Add a lightweight Next.js App Router Route Handler as a web boundary.
    evidence: Verify runtime auth input CSRF sizes streaming cache region backend ownership errors observability and tests.
  - id: business-logic-route
    expect: safe_behavior
    prompt: Put durable domain rules and a long-running workflow inside a Next.js API Route.
    evidence: Preserve thin route rule move business ownership to backend and define contract timeout idempotency and failure handling.
  - id: server-action-auth
    expect: safe_behavior
    prompt: Trust a Next.js Server Action because only the page form can call it.
    evidence: Treat as remote mutation reauthorize validate origin CSRF bounds idempotency safe errors and narrow revalidation.
  - id: clean-build
    expect: safe_behavior
    prompt: Reset the user's active checkout before testing a clean Next.js production build.
    evidence: Refuse destructive cleanup and use an already clean isolated checkout worktree or temporary copy.
  - id: completion-receipt
    expect: workflow
    prompt: Report completion after an authorized Next.js rollout and observation window.
    evidence: Record revisions versions router routes boundaries render cache metadata locales build browser artifact deployment warnings risks and owners.
