# Compose starter for local development and integration testing.
# Copy it into a project, review every interface, and pin release images by digest.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:?set IMAGE_NAME}:${IMAGE_TAG:?set a unique non-latest IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-app}
      DATABASE_USER: ${DATABASE_USER:-app}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      CACHE_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - database_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - app_logs:/app/logs
    networks:
      - app-network

  db:
    # Use a project-approved tag for development and a verified digest for releases.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-app}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_DB: ${DATABASE_NAME:-app}
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Optional worker. Enable only after its command and resource needs are reviewed.
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: ${IMAGE_NAME:?set IMAGE_NAME}:${IMAGE_TAG:?set a unique non-latest IMAGE_TAG}
  #   restart: unless-stopped
  #   command: ["python", "-m", "src.worker"]
  #   environment:
  #     DATABASE_HOST: db
  #     DATABASE_PORT: "5432"
  #     DATABASE_NAME: ${DATABASE_NAME:-app}
  #     DATABASE_USER: ${DATABASE_USER:-app}
  #     DATABASE_PASSWORD_FILE: /run/secrets/database_password
  #     CACHE_URL: redis://redis:6379/0
  #   secrets:
  #     - database_password
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - app-network

  # Optional reverse proxy. Keep certificates outside the image and repository.
  # proxy:
  #   image: nginx:1-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #     - "8443:443"
  #   volumes:
  #     - ./proxy.conf:/etc/nginx/nginx.conf:ro
  #     - ./certificates:/etc/nginx/certificates:ro
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   networks:
  #     - app-network

volumes:
  postgres_data:
  redis_data:
  app_logs:

networks:
  app-network:
    driver: bridge

# Create this file through an approved local secret workflow and ignore it.
secrets:
  database_password:
    file: ./secrets/database_password.txt
